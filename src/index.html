<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Angular Academy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interaktive Angular-Schulung mit Live-Beispielen im Browser.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('angular-academy.theme'));
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
