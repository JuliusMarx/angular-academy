<a class="skip-link" href="#main">{{ lang() === 'de' ? 'Zum Inhalt springen' : 'Skip to content' }}</a>

<app-header [lang]="lang()" [url]="url()" [(menuOpen)]="menuOpen" />

<div class="layout">
  <app-sidebar [lang]="lang()" [class.open]="menuOpen()" id="course-nav" />
  @if (menuOpen()) {
    <button type="button" class="backdrop" [attr.aria-label]="text().closeMenu" (click)="menuOpen.set(false)"></button>
  }
  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
